name: Refine product share UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-share:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refine share behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wissfind-fullstack-seller-admin-image-fixed-build/angular/src/app/pages/product-detail.component.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''              <button *ngIf="canNativeShare" type="button" (click)="nativeShare()">Share image + link</button>\n''', '')
          s = s.replace('''            <small>Social links share the product page URL. Native share can include the selected product image.</small>''', '''            <small>On mobile, WhatsApp sharing includes the product image and link. On desktop, WhatsApp uses the product page preview image.</small>''')
          s = s.replace('''    const text = `${this.product.name}\\n${this.pageUrl}\\n${this.selectedImage}`;''', '''    const text = `${this.product.name}\\n${this.pageUrl}`;''')
          s = s.replace('''        title: this.product.name,\n        text: `${this.product.name}\\n${this.pageUrl}`,\n        url: this.pageUrl''', '''        text: `${this.product.name}\\n${this.pageUrl}`,\n        url: this.pageUrl''')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wissfind-fullstack-seller-admin-image-fixed-build/angular/src/app/pages/product-detail.component.ts
          git commit -m "fix: avoid duplicate title in product sharing" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-product-share-ui.yml || true
          git commit -m "chore: remove temporary share workflow" || true
          git push || true
