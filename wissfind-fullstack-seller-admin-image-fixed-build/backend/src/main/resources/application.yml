spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    expose-dev: false
    provider: NINZA
    ninza:
      authorization: ${NINZA_SMS_AUTH:}
      sender-id: ${NINZA_SMS_SENDER_ID:}
      base-url: ${NINZA_SMS_BASE_URL:https://ninzasms.in.net/auth/send_sms.php}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
